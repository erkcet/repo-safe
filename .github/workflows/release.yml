name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build immutable artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"
          cache: false
      - run: uv sync --locked --all-groups
      - name: Validate tag and package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/repo_safe
      - run: uv run pytest --cov=repo_safe --cov-report=term-missing -q
      - run: uv run pip-audit
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --no-banner --redact
      - run: uv build --clear
      - run: uv run twine check dist/*
      - name: Smoke-test the built wheel
        shell: bash
        run: |
          uv venv /tmp/repo-safe-release-smoke
          uv pip install --python /tmp/repo-safe-release-smoke/bin/python dist/*.whl
          /tmp/repo-safe-release-smoke/bin/repo-safe --version
          mkdir /tmp/repo-safe-release-source
          printf 'REGION=abc\n' > /tmp/repo-safe-release-source/.env
          /tmp/repo-safe-release-smoke/bin/repo-safe sanitize \
            /tmp/repo-safe-release-source /tmp/repo-safe-release-output --json
          /tmp/repo-safe-release-smoke/bin/repo-safe verify \
            /tmp/repo-safe-release-output --json
          grep -Fx 'REGION=[REDACTED]' /tmp/repo-safe-release-output/.env
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --title "repo-safe ${GITHUB_REF_NAME}"
